<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <style>
      html,
      body,
      #root {
        margin: 0;
        min-height: 100%;
        background: #020604;
        color: #e6fff5;
      }

      body {
        min-width: 320px;
      }

      html[data-theme="light"][data-light-intensity="0"],
      html[data-theme="light"][data-light-intensity="10"],
      html[data-theme="light"][data-light-intensity="20"],
      html[data-theme="light"][data-light-intensity="0"] body,
      html[data-theme="light"][data-light-intensity="10"] body,
      html[data-theme="light"][data-light-intensity="20"] body,
      html[data-theme="light"][data-light-intensity="0"] #root,
      html[data-theme="light"][data-light-intensity="10"] #root,
      html[data-theme="light"][data-light-intensity="20"] #root {
        background: #fbfefc;
        color: #153326;
      }

      html[data-theme="light"][data-light-intensity="30"],
      html[data-theme="light"][data-light-intensity="40"],
      html[data-theme="light"][data-light-intensity="50"],
      html[data-theme="light"][data-light-intensity="60"],
      html[data-theme="light"][data-light-intensity="70"],
      html[data-theme="light"][data-light-intensity="30"] body,
      html[data-theme="light"][data-light-intensity="40"] body,
      html[data-theme="light"][data-light-intensity="50"] body,
      html[data-theme="light"][data-light-intensity="60"] body,
      html[data-theme="light"][data-light-intensity="70"] body,
      html[data-theme="light"][data-light-intensity="30"] #root,
      html[data-theme="light"][data-light-intensity="40"] #root,
      html[data-theme="light"][data-light-intensity="50"] #root,
      html[data-theme="light"][data-light-intensity="60"] #root,
      html[data-theme="light"][data-light-intensity="70"] #root {
        background: #f4faf6;
        color: #173326;
      }

      html[data-theme="light"][data-light-intensity="80"],
      html[data-theme="light"][data-light-intensity="90"],
      html[data-theme="light"][data-light-intensity="100"],
      html[data-theme="light"][data-light-intensity="80"] body,
      html[data-theme="light"][data-light-intensity="90"] body,
      html[data-theme="light"][data-light-intensity="100"] body,
      html[data-theme="light"][data-light-intensity="80"] #root,
      html[data-theme="light"][data-light-intensity="90"] #root,
      html[data-theme="light"][data-light-intensity="100"] #root {
        background: #e4f0e8;
        color: #143025;
      }
    </style>
      <script>
      try {
        const theme = localStorage.getItem('horizon-theme');
        let storedPreferences = {};
        try {
          storedPreferences = JSON.parse(localStorage.getItem('stanza.preferences.v1') || '{}');
        } catch {
          storedPreferences = {};
        }
        const legacyIntensity = { bright: 15, balanced: 50, deep: 85 };
        const numericIntensity = typeof storedPreferences.lightIntensity === 'number'
          ? storedPreferences.lightIntensity
          : legacyIntensity[storedPreferences.lightIntensity];
        const safeIntensity = Number.isFinite(numericIntensity)
          ? Math.min(100, Math.max(0, Math.round(numericIntensity)))
          : 50;
        const lightIntensity = Math.round(safeIntensity / 10) * 10;
        document.documentElement.dataset.lightIntensity = lightIntensity;
        if (theme === 'light') {
          document.documentElement.classList.remove('dark');
          document.documentElement.dataset.theme = 'light';
          document.documentElement.style.colorScheme = 'light';
        } else {
          document.documentElement.classList.add('dark');
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.style.colorScheme = 'dark';
        }
      } catch {
        document.documentElement.classList.add('dark');
        document.documentElement.dataset.theme = 'dark';
        document.documentElement.style.colorScheme = 'dark';
      }
    </script>
    <meta
      name="description"
      content="Stanza is a modern workforce operations platform for attendance, geofencing, payroll, leave requests, grievances, and company communication."
    />
    <meta name="robots" content="index, follow" />

    <link rel="icon" type="image/png" sizes="16x16" href="/icons/stanza-favicon-16.png" />
    <link rel="apple-touch-icon" href="/icons/stanza-icon-192.png" />
